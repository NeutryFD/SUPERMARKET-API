services:
  api:
    build: .
    restart: unless-stopped
    environment:
      SUPERMARKET_API_SCRAPE_TOKEN: ${SUPERMARKET_API_SCRAPE_TOKEN:?set SUPERMARKET_API_SCRAPE_TOKEN in .env}
      SUPERMARKET_API_POSTCODE: ${SUPERMARKET_API_POSTCODE:-08001}
      SUPERMARKET_API_ENABLED_SUPERMARKETS: ${SUPERMARKET_API_ENABLED_SUPERMARKETS:-["mercadona","bonarea","aldi","consum","masymas","lidl"]}
      SUPERMARKET_API_CORS_ORIGINS: ${SUPERMARKET_API_CORS_ORIGINS:-[]}
    volumes:
      - api-data:/data
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8100}:8000"

volumes:
  api-data:

# Named network so other stacks (mercabarna) can reach the API as http://api:8000
networks:
  default:
    name: supermarket-api
